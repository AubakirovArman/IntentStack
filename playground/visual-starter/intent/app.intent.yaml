version: 0.1
project:
  id: visual_starter
  name: 3D Visual Starter
  target: web_ts_minimal
theme:
  preset: minimal
  radius: md
  density: comfortable
  color: neutral
pages:
  - id: home
    path: /
    layout: landing
    sections:
      - id: hero
        type: hero
        title: 3D Visual
        subtitle: A focused one-page web app for presenting 3D visualization services.
        actions:
          - label: View process
            kind: primary
            target: '#process'
      - id: process
        type: card_grid
        title: From brief to render
        columns: 3
        items:
          - title: Brief
            text: Collect the room, product, mood, dimensions, and reference materials.
          - title: Model
            text: Prepare the scene, materials, camera angles, and lighting direction.
          - title: Deliver
            text: Export polished visuals for approvals, sales pages, and presentations.
      - id: footer
        type: footer
        text: 3D Visual Starter generated by IntentStack.
  - id: docs
    path: /docs
    layout: docs
    sections:
      - id: docs_content
        type: content
        title: IntentStack Documentation
        blocks:
          - id: overview
            type: heading
            level: 2
            text: What IntentStack is
          - id: overview_text
            type: paragraph
            text: >-
              IntentStack is an AI-native fullstack compiler. The application is described as intent
              in intent/app.intent.yaml, and the compiler generates framework code, routes, API
              handlers, database files, styles, and migrations.
          - id: generated
            type: heading
            level: 2
            text: What it can generate
          - id: generated_list
            type: list
            items:
              - Multi-page React/Vite applications for the web_ts_minimal target.
              - Next.js App Router applications for the next_shadcn target.
              - >-
                Shared navigation, landing sections, documentation content, forms, tables, record
                detail pages, stats, pricing cards, and custom component wrappers.
              - >-
                CRUD APIs, Drizzle/SQLite schema, migrations, zod validators, and generated API
                clients.
              - Auth, workflow, and integration scaffolding for the supported MVP contracts.
          - id: workflow
            type: heading
            level: 2
            text: Agent workflow
          - id: workflow_list
            type: list
            items:
              - Read the current intent before changing behavior.
              - Express the next change as a semantic patch instead of editing generated code.
              - Run intentstack apply as a dry run and inspect the semantic diff.
              - Run intentstack check, then intentstack build.
              - Verify the generated application with typecheck and production build.
          - id: command
            type: code
            language: powershell
            code: >
              node ..\..\intentstack\src\index.js apply .\patches\004-write-tool-documentation.yaml
              --project .

              node ..\..\intentstack\src\index.js check --project .

              node ..\..\intentstack\src\index.js build --project .
          - id: core_loop
            type: heading
            level: 2
            text: Core compiler loop
          - id: core_loop_list
            type: list
            items:
              - Parse the intent file.
              - >-
                Validate schema, target capabilities, references, auth policies, and component
                contracts.
              - Build a target-neutral Core IR.
              - Plan generated files before writing them.
              - Emit target-specific frontend, backend, database, and support files.
          - id: semantic_patches
            type: heading
            level: 2
            text: Semantic patches
          - id: semantic_patches_text
            type: paragraph
            text: >-
              Patches are small machine-readable changes such as navigation.item.add, page.create,
              section.add, entity.field.add, and content.block.update. The compiler validates the
              result before writing it back to intent/app.intent.yaml.
          - id: targets
            type: heading
            level: 2
            text: Targets
          - id: targets_list
            type: list
            items:
              - web_ts_minimal emits Vite, React, Tailwind/daisyUI, Hono API, Drizzle, and SQLite.
              - >-
                next_shadcn emits Next.js App Router, shadcn-style primitives, route handlers,
                Drizzle, and SQLite.
              - >-
                The same intent can compile to both targets when each declared component and action
                is supported.
          - id: diagnostics
            type: heading
            level: 2
            text: Diagnostics and safety
          - id: diagnostics_list
            type: list
            items:
              - >-
                Errors and warnings include code, severity, message, path, suggestion, and sometimes
                fix_hint.
              - >-
                Unsupported fields, actions, components, routes, and references are rejected before
                generation.
              - Generated zones are disposable; custom code belongs outside generated folders.
              - diff, graph, stats, security, and verify commands help audit intent and output.
          - id: current_limits
            type: heading
            level: 2
            text: Current limits
          - id: current_limits_list
            type: list
            items:
              - >-
                There is not yet a visual browser editor; editing is done through intent and patch
                files.
              - >-
                Content blocks are useful, but still basic: no nested rich text, links, callouts, or
                reusable snippets.
              - Generated dependency versions still need an audit-hardening pass.
              - >-
                Production auth, durable workflows, deployments, and provider-specific integrations
                need deeper hardening.
      - id: docs_footer
        type: footer
        text: IntentStack documentation generated from a semantic patch.
navigation:
  logo: 3D Visual
  items:
    - label: Home
      href: /
    - label: Process
      href: /#process
    - label: Docs
      href: /docs
    - label: Contact
      href: /#footer
