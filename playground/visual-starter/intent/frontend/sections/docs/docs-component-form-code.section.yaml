section:
  id: docs_component_form_code
  type: content
  title: Patch code for form
  toc: false
  blocks:
    - id: form_patch
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: entity.create
            id: DemoRequest
            table: demo_requests
            fields:
              - id: name
                type: string
                required: true
              - id: email
                type: string
                required: true
              - id: message
                type: text
          - op: action.create
            id: create_demo_request
            type: create_record
            entity: DemoRequest
          - op: section.module.add
            page: docs
            after: docs_component_cards_code
            section:
              id: docs_component_form
              type: form
              title: Live form example
              entity: DemoRequest
              fields: [name, email, message]
              submit:
                action: create_demo_request
                success_message: Demo request saved.
page: docs
