section:
  id: docs_content
  type: content
  title: IntentStack Documentation
  blocks:
    - id: overview
      type: heading
      level: 2
      text: What IntentStack is
    - id: overview_text
      type: paragraph
      text: >-
        IntentStack is an AI-native fullstack compiler. The application is described as modular
        intent: a small root manifest includes focused files under shared, frontend, and backend
        folders. The compiler assembles those modules and generates framework code, routes, API
        handlers, database files, styles, and migrations.
    - id: generated
      type: heading
      level: 2
      text: What it can generate
    - id: generated_list
      type: list
      items:
        - Multi-page React/Vite applications for the web_ts_minimal target.
        - Next.js App Router applications for the next_shadcn target.
        - >-
          Shared navigation, landing sections, documentation content, forms, tables, record detail
          pages, stats, pricing cards, and custom component wrappers.
        - CRUD APIs, Drizzle/SQLite schema, migrations, zod validators, and generated API clients.
        - Auth, workflow, and integration scaffolding for the supported MVP contracts.
    - id: workflow
      type: heading
      level: 2
      text: Agent workflow
    - id: workflow_list
      type: list
      items:
        - Read the root intent and the relevant owner module before changing behavior.
        - Express the next change as a semantic patch instead of editing generated code.
        - Run intentstack apply as a dry run and inspect the semantic diff.
        - Run intentstack apply --write so the compiler writes back to the owner module.
        - Run intentstack check, intentstack build, then verify the generated application.
    - id: command
      type: code
      language: powershell
      code: >
        node ..\..\intentstack\src\index.js apply .\patches\004-write-tool-documentation.yaml
        --project .

        node ..\..\intentstack\src\index.js check --project .

        node ..\..\intentstack\src\index.js build --project .
    - id: core_loop
      type: heading
      level: 2
      text: Core compiler loop
    - id: core_loop_list
      type: list
      items:
        - Parse the intent file.
        - Validate schema, target capabilities, references, auth policies, and component contracts.
        - Build a target-neutral Core IR.
        - Plan generated files before writing them.
        - Emit target-specific frontend, backend, database, and support files.
    - id: modular_first
      type: heading
      level: 2
      text: Modular structure is the foundation
    - id: modular_first_text
      type: paragraph
      text: >-
        A real app should not grow as one huge YAML file. Keep the root file as a manifest and put
        behavior into small owner modules. This gives agents a precise edit target and keeps
        diagnostics actionable.
    - id: modular_tree
      type: code
      language: text
      code: |
        intent/
          app.intent.yaml                 # version, project, includes
          shared/
            navigation.yaml               # global navigation
            theme.yaml                    # design tokens
          frontend/
            pages/
              home.page.yaml              # route + section refs
              docs.page.yaml
            sections/
              home/hero.section.yaml      # focused UI modules
              docs/docs-content.section.yaml
          backend/
            entities/lead.entity.yaml     # data model modules
            actions/create-lead.action.yaml
    - id: modular_patch_writeback
      type: callout
      title: Patch writeback
      text: >-
        In a modular project, intentstack apply --write preserves the module layout. A docs copy
        change writes to the docs section file, a navigation change writes to
        shared/navigation.yaml, and an entity change writes to backend/entities.
    - id: semantic_patches
      type: heading
      level: 2
      text: Semantic patches
    - id: semantic_patches_text
      type: paragraph
      text: >-
        Patches are small machine-readable changes such as navigation.item.add, page.create,
        section.add, entity.field.add, and content.block.update. The compiler validates the
        assembled result before writing changes back to the correct owner module.
    - id: targets
      type: heading
      level: 2
      text: Targets
    - id: targets_list
      type: list
      items:
        - web_ts_minimal emits Vite, React, Tailwind/daisyUI, Hono API, Drizzle, and SQLite.
        - >-
          next_shadcn emits Next.js App Router, shadcn-style primitives, route handlers, Drizzle,
          and SQLite.
        - >-
          The same intent can compile to both targets when each declared component and action is
          supported.
    - id: diagnostics
      type: heading
      level: 2
      text: Diagnostics and safety
    - id: diagnostics_list
      type: list
      items:
        - >-
          Errors and warnings include code, severity, message, path, suggestion, and sometimes
          fix_hint.
        - >-
          Unsupported fields, actions, components, routes, and references are rejected before
          generation.
        - Generated zones are disposable; custom code belongs outside generated folders.
        - diff, graph, stats, security, and verify commands help audit intent and output.
    - id: authoring_examples
      type: heading
      level: 2
      text: Authoring examples
    - id: authoring_examples_intro
      type: paragraph
      text: >-
        These snippets show the normal way to extend an app. Save a focused patch file, run
        intentstack apply as a dry run, then run it again with --write so the modular owner files
        are updated safely.
    - id: authoring_matrix
      type: table
      columns:
        - Goal
        - Patch ops
        - Generated result
      rows:
        - - Add cards
          - section.add
          - React card grid component
        - - Add a form
          - entity.create + action.create + form.add
          - Form UI plus POST API route
        - - Add a table
          - action.create + table.add
          - Data table plus GET API client
        - - Add plans or metrics
          - section.add
          - Pricing or stats section
        - - Add a page
          - page.create + navigation.item.add
          - New route and nav item
    - id: cards_example
      type: heading
      level: 3
      text: Add cards
    - id: cards_example_code
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: section.add
            page: home
            after: hero
            section:
              id: services
              type: card_grid
              title: Services
              columns: 3
              items:
                - title: Interior renders
                  text: Room scenes with materials, lighting, and camera direction.
                - title: Product shots
                  text: Studio-style visuals for catalogs and landing pages.
                - title: Animation frames
                  text: Key frames for motion concepts and presentations.
    - id: form_example
      type: heading
      level: 3
      text: Add a form
    - id: form_example_code
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: entity.create
            id: Brief
            table: briefs
            fields:
              - id: name
                type: string
                label: Name
                required: true
              - id: email
                type: string
                label: Email
                required: true
              - id: project_type
                type: enum
                label: Project type
                values: [interior, product, animation]
              - id: notes
                type: text
                label: Notes
          - op: action.create
            id: create_brief
            type: create_record
            entity: Brief
          - op: form.add
            page: home
            id: brief_form
            title: Request a visualization brief
            entity: Brief
            fields: [name, email, project_type, notes]
            action: create_brief
    - id: table_example
      type: heading
      level: 3
      text: Add a table
    - id: table_example_code
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: action.create
            id: list_briefs
            type: list_records
            entity: Brief
          - op: page.create
            id: dashboard_briefs
            path: /dashboard/briefs
            layout: dashboard
          - op: table.add
            page: dashboard_briefs
            id: briefs_table
            entity: Brief
            action: list_briefs
            columns: [name, email, project_type]
    - id: pricing_stats_example
      type: heading
      level: 3
      text: Add pricing or stats
    - id: pricing_stats_example_code
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: section.add
            page: home
            after: process
            section:
              id: pricing
              type: pricing_cards
              title: Visualization packages
              items:
                - title: Concept
                  price: from $300
                  features: [One room, Two angles, Basic material pass]
                - title: Presentation
                  price: from $900
                  features: [Three scenes, Styled lighting, Revision pass]
          - op: section.add
            page: home
            after: pricing
            section:
              id: proof
              type: stats
              title: Delivery metrics
              items:
                - label: Average first draft
                  value: 3 days
                - label: Supported formats
                  value: 6+
    - id: page_nav_example
      type: heading
      level: 3
      text: Add a page and navigation item
    - id: page_nav_example_code
      type: code
      language: yaml
      code: |
        version: 0.1
        patch:
          - op: page.create
            id: case_studies
            path: /case-studies
            layout: docs
            sections:
              - id: case_studies_content
                type: content
                title: Case studies
                blocks:
                  - id: intro
                    type: paragraph
                    text: Show examples of previous visualization work.
          - op: navigation.item.add
            item:
              label: Case studies
              href: /case-studies
    - id: authoring_note
      type: callout
      title: Practical rule
      text: >-
        Keep each patch focused. One page, one section, or one entity change is easier to review and
        easier to roll back.
    - id: current_limits
      type: heading
      level: 2
      text: Current limits
    - id: current_limits_list
      type: list
      items:
        - There is not yet a visual browser editor; editing is done through intent and patch files.
        - >-
          Content is intentionally structured, so it is reliable for agents but not yet a full rich
          text editor.
        - Generated dependency versions still need an audit-hardening pass.
        - >-
          Production auth, durable workflows, deployments, and provider-specific integrations need
          deeper hardening.
