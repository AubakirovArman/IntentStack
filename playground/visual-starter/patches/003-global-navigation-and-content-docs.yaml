version: 0.1
patch:
  - op: navigation.set
    logo: 3D Visual
    items:
      - label: Home
        href: /
      - label: Process
        href: /#process
      - label: Docs
        href: /docs
      - label: Contact
        href: /#footer

  - op: section.remove
    page: home
    section: nav

  - op: page.update
    id: docs
    layout: docs

  - op: section.remove
    page: docs
    section: docs_nav

  - op: section.remove
    page: docs
    section: docs_hero

  - op: section.remove
    page: docs
    section: docs_overview

  - op: section.remove
    page: docs
    section: docs_workflow

  - op: section.add
    page: docs
    before: docs_footer
    section:
      id: docs_content
      type: content
      title: Documentation
      blocks:
        - id: overview
          type: heading
          level: 2
          text: Overview
        - id: overview_text
          type: paragraph
          text: This generated app is controlled by intent/app.intent.yaml and small semantic patches.
        - id: generated
          type: heading
          level: 2
          text: What is generated
        - id: generated_list
          type: list
          items:
            - Shared navigation is declared once at the top level.
            - Pages and sections are generated from supported component types.
            - React routes, styles, server files, and migrations are regenerated by IntentStack.
        - id: workflow
          type: heading
          level: 2
          text: Editing workflow
        - id: workflow_list
          type: list
          items:
            - Write a semantic patch for the next change.
            - Run intentstack check to validate the result.
            - Run intentstack build and verify the generated app.
        - id: command
          type: code
          language: powershell
          code: node ..\..\intentstack\src\index.js build --project .
