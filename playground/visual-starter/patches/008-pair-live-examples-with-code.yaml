version: 0.1
patch:
  - op: content.block.update
    section: docs_content
    block: authoring_examples_intro
    value:
      text: >-
        Each example below is paired: the generated live component appears first, and the patch code
        that creates the same kind of component appears directly below it.

  - op: content.block.update
    section: docs_content
    block: live_component_demo_note
    value:
      title: Live example + code
      text: >-
        Read each example as a pattern: inspect the generated component, then copy the patch below it
        and adapt the ids, text, fields, or records for your app.

  - op: content.block.remove
    section: docs_content
    block: cards_example
  - op: content.block.remove
    section: docs_content
    block: cards_example_code
  - op: content.block.remove
    section: docs_content
    block: form_example
  - op: content.block.remove
    section: docs_content
    block: form_example_code
  - op: content.block.remove
    section: docs_content
    block: table_example
  - op: content.block.remove
    section: docs_content
    block: table_example_code
  - op: content.block.remove
    section: docs_content
    block: pricing_stats_example
  - op: content.block.remove
    section: docs_content
    block: pricing_stats_example_code
  - op: content.block.remove
    section: docs_content
    block: page_nav_example
  - op: content.block.remove
    section: docs_content
    block: page_nav_example_code

  - op: section.module.add
    page: docs
    after: docs_component_cards
    section:
      id: docs_component_cards_code
      type: content
      title: Patch code for card_grid
      toc: false
      blocks:
        - id: cards_patch
          type: code
          language: yaml
          code: |
            version: 0.1
            patch:
              - op: section.module.add
                page: docs
                after: docs_content
                section:
                  id: docs_component_cards
                  type: card_grid
                  title: Live card_grid example
                  columns: 3
                  items:
                    - title: Card title
                      text: A card_grid section renders repeated cards from structured items.
                    - title: Agent-friendly
                      text: Each card is data, so an agent can update cards safely.

  - op: section.module.add
    page: docs
    after: docs_component_form
    section:
      id: docs_component_form_code
      type: content
      title: Patch code for form
      toc: false
      blocks:
        - id: form_patch
          type: code
          language: yaml
          code: |
            version: 0.1
            patch:
              - op: entity.create
                id: DemoRequest
                table: demo_requests
                fields:
                  - id: name
                    type: string
                    required: true
                  - id: email
                    type: string
                    required: true
                  - id: message
                    type: text
              - op: action.create
                id: create_demo_request
                type: create_record
                entity: DemoRequest
              - op: section.module.add
                page: docs
                after: docs_component_cards_code
                section:
                  id: docs_component_form
                  type: form
                  title: Live form example
                  entity: DemoRequest
                  fields: [name, email, message]
                  submit:
                    action: create_demo_request
                    success_message: Demo request saved.

  - op: section.module.add
    page: docs
    after: docs_component_table
    section:
      id: docs_component_table_code
      type: content
      title: Patch code for table
      toc: false
      blocks:
        - id: table_patch
          type: code
          language: yaml
          code: |
            version: 0.1
            patch:
              - op: action.create
                id: list_demo_requests
                type: list_records
                entity: DemoRequest
              - op: section.module.add
                page: docs
                after: docs_component_form_code
                section:
                  id: docs_component_table
                  type: table
                  entity: DemoRequest
                  source:
                    action: list_demo_requests
                  columns: [name, email, project_type, budget]

  - op: section.module.add
    page: docs
    after: docs_component_pricing
    section:
      id: docs_component_pricing_code
      type: content
      title: Patch code for pricing_cards
      toc: false
      blocks:
        - id: pricing_patch
          type: code
          language: yaml
          code: |
            version: 0.1
            patch:
              - op: section.module.add
                page: docs
                after: docs_component_table_code
                section:
                  id: docs_component_pricing
                  type: pricing_cards
                  title: Live pricing_cards example
                  items:
                    - title: Starter
                      price: from $300
                      features: [One room or product, Two camera angles]
                    - title: Studio
                      price: from $900
                      features: [Three scenes, Styled lighting, Revision pass]

  - op: section.module.add
    page: docs
    after: docs_component_stats
    section:
      id: docs_component_stats_code
      type: content
      title: Patch code for stats
      toc: false
      blocks:
        - id: stats_patch
          type: code
          language: yaml
          code: |
            version: 0.1
            patch:
              - op: section.module.add
                page: docs
                after: docs_component_pricing_code
                section:
                  id: docs_component_stats
                  type: stats
                  title: Live stats example
                  items:
                    - label: First draft
                      value: 3 days
                    - label: Formats
                      value: 6+
                    - label: Modules
                      value: 100%
