version: 0.1
patch:
  - op: navbar.item.remove
    navbar: nav
    label: Contact

  - op: navbar.item.add
    navbar: nav
    item:
      label: Docs
      href: /docs

  - op: navbar.item.add
    navbar: nav
    item:
      label: Contact
      href: '#footer'

  - op: page.create
    id: docs
    path: /docs
    layout: landing
    sections:
      - id: docs_nav
        type: navbar
        logo: 3D Visual
        items:
          - label: Home
            href: /
          - label: Process
            href: /#process
          - label: Docs
            href: /docs
          - label: Contact
            href: /#footer

      - id: docs_hero
        type: hero
        title: Documentation
        subtitle: A compact guide for how this generated web app is structured and how we will extend it step by step.
        actions:
          - label: Back home
            kind: secondary
            target: /

      - id: docs_overview
        type: card_grid
        title: What is generated
        columns: 3
        items:
          - title: Intent
            text: The app behavior lives in intent/app.intent.yaml and patch files.
          - title: Pages
            text: Pages are generated from declared routes, sections, and supported components.
          - title: Code
            text: React, styles, routes, server files, and migrations are regenerated by IntentStack.

      - id: docs_workflow
        type: card_grid
        title: Editing workflow
        columns: 3
        items:
          - title: Patch
            text: Describe the next change as a semantic patch instead of editing generated code.
          - title: Check
            text: Run intentstack check and fix diagnostics before generating files.
          - title: Build
            text: Run intentstack build, then verify the generated app with TypeScript and production build.

      - id: docs_footer
        type: footer
        text: Documentation page generated by IntentStack.
