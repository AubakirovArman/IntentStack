version: 0.1

project:
  id: lead_capture_example
  name: Lead Capture
  target: web_ts_minimal

theme:
  preset: minimal
  radius: md
  density: comfortable
  color: neutral

entities:
  - id: Lead
    table: leads
    fields:
      - id: name
        type: string
        label: Name
        required: true
      - id: email
        type: string
        label: Email
        required: true
      - id: message
        type: text
        label: Message

actions:
  - id: create_lead
    type: create_record
    entity: Lead

pages:
  - id: home
    path: /
    layout: landing
    sections:
      - id: hero
        type: hero
        title: Lead Capture
        subtitle: Collect leads through a generated form.
      - id: lead_form
        type: form
        title: Contact
        entity: Lead
        fields: [name, email, message]
        submit:
          action: create_lead
          success_message: Thanks.
