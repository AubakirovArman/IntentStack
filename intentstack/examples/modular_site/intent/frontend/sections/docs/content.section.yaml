section:
  id: docs_content
  type: content
  title: Modular frontend documentation
  blocks:
    - id: overview
      type: heading
      level: 2
      text: Overview
    - id: overview_text
      type: paragraph
      text: A root manifest can include frontend modules and assemble them into one validated application graph.
    - id: layout
      type: heading
      level: 2
      text: Layout
    - id: layout_steps
      type: list
      items:
        - Keep route metadata in page modules.
        - Keep reusable UI sections in section modules.
        - Reference sections by stable ids from page modules.
    - id: note
      type: callout
      title: Authoring note
      text: Content modules can mix prose, links, callouts, code, and tables.
    - id: reference
      type: link
      text: Open the lead workspace
      href: /leads
    - id: matrix
      type: table
      columns: [Layer, Module]
      rows:
        - [Frontend, page and section files]
        - [Backend, entity and action files]
    - id: command
      type: code
      language: bash
      code: intentstack build --project .
