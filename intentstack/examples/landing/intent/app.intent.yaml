version: 0.1

project:
  id: landing_example
  name: Landing Example
  target: web_ts_minimal

theme:
  preset: minimal
  radius: md
  density: comfortable
  color: neutral

pages:
  - id: home
    path: /
    layout: landing
    sections:
      - id: nav
        type: navbar
        logo: Landing
        items:
          - label: Features
            href: "#features"
      - id: hero
        type: hero
        title: Landing Example
        subtitle: A static page generated from intent.
      - id: features
        type: card_grid
        title: Features
        columns: 3
        items:
          - title: Fast
            text: Generated quickly.
          - title: Typed
            text: Validated before emit.
          - title: Portable
            text: Target adapters own framework details.
      - id: footer
        type: footer
        text: Generated by IntentStack.
