version: 0.1
project:
  id: voice_agent_site
  name: VoiceAgent
  target: web_ts_minimal
theme:
  preset: minimal
  radius: md
  density: comfortable
  color: neutral
entities:
  - id: Lead
    table: leads
    fields:
      - id: name
        type: string
        label: Name
        required: true
      - id: phone
        type: string
        label: Phone
        required: true
      - id: company
        type: string
        label: Company
        required: false
      - id: message
        type: text
        label: Message
        required: false
      - id: status
        type: enum
        values:
          - new
          - contacted
          - closed
        default: new
actions:
  - id: create_lead
    type: create_record
    entity: Lead
  - id: list_leads
    type: list_records
    entity: Lead
  - id: get_lead
    type: get_record
    entity: Lead
  - id: update_lead
    type: update_record
    entity: Lead
pages:
  - id: home
    path: /
    layout: landing
    sections:
      - id: nav
        type: navbar
        logo: VoiceAgent
        items:
          - label: Features
            href: '#features'
          - label: Contact
            href: '#lead_form'
          - label: Docs
            href: /docs
      - id: hero
        type: hero
        variant: centered
        title: AI voice agents for business
        subtitle: Automate calls, qualify leads, and reduce manual work.
        actions:
          - label: Book demo
            kind: primary
            target: '#lead_form'
      - id: features
        type: card_grid
        title: What it does
        columns: 3
        items:
          - title: Answers calls
            text: Handles repetitive customer conversations.
          - title: Qualifies leads
            text: Collects contact details and intent automatically.
          - title: Shows a dashboard
            text: Tracks every request in one place.
      - id: lead_form
        type: form
        title: Request a demo
        entity: Lead
        fields:
          - name
          - phone
          - company
          - message
        submit:
          action: create_lead
          success_message: Thanks. We will contact you soon.
      - id: footer
        type: footer
        text: © VoiceAgent. Built from one intent file.
  - id: dashboard_leads
    path: /dashboard/leads
    layout: dashboard
    title: Leads
    sections:
      - id: leads_table
        type: table
        entity: Lead
        source:
          action: list_leads
        columns:
          - name
          - phone
          - company
          - status
        row_actions:
          - type: detail
          - type: edit
  - id: dashboard_lead_detail
    path: /dashboard/leads/:id
    layout: dashboard
    auth: reserved
    title: Lead detail
    sections:
      - id: lead_detail
        type: record_detail
        entity: Lead
        source:
          action: get_lead
        fields:
          - name
          - phone
          - company
          - message
          - status
        update:
          action: update_lead
  - id: docs
    path: /docs
    layout: docs
    sections:
      - id: docs_nav
        type: navbar
        logo: VoiceAgent
        items:
          - label: Home
            href: /
          - label: Features
            href: /#features
          - label: Contact
            href: /#lead_form
          - label: Docs
            href: /docs
      - id: docs_content
        type: content
        title: IntentStack Documentation
        blocks:
          - id: random_snapshot_table
            type: table
            columns:
              - Name
              - Category
              - Priority
              - Score
              - Note
            rows:
              - - Atlas
                - Workflow
                - High
                - 92
                - Ready for review
              - - Nova
                - Frontend
                - Medium
                - 74
                - Needs copy polish
              - - Pulse
                - Backend
                - High
                - 88
                - API contract checked
              - - Echo
                - Docs
                - Low
                - 61
                - Draft example added
              - - Vertex
                - Database
                - Medium
                - 79
                - Migration path clear
              - - Orbit
                - Testing
                - High
                - 95
                - Build gate passed
              - - Quartz
                - Design
                - Medium
                - 83
                - Layout fits mobile
              - - Nimbus
                - Deploy
                - Low
                - 68
                - Provider config pending
          - id: overview
            type: heading
            level: 2
            text: What this tool does
          - id: overview_text
            type: paragraph
            text: >-
              IntentStack lets an AI agent describe an application as typed intent. The compiler
              validates that intent and generates frontend, backend, database schema, API clients,
              migrations and tests for the selected target.
          - id: workflow
            type: heading
            level: 2
            text: Basic workflow
          - id: workflow_steps
            type: list
            items:
              - Edit intent files or apply a semantic patch.
              - Run intentstack check to validate references and target capabilities.
              - Run intentstack build to regenerate managed app code.
              - Run the generated app and verify the result in the browser.
          - id: patch_example_title
            type: heading
            level: 2
            text: Example patch
          - id: patch_example
            type: code
            language: yaml
            code: |
              version: 0.1
              patch:
                - op: page.create
                  id: docs
                  path: /docs
                  layout: docs
                - op: section.add
                  page: docs
                  section:
                    id: docs_content
                    type: content
                    title: Documentation
          - id: generated_zones
            type: callout
            title: Generated zones
            text: >-
              Do not edit files under src/generated, server/generated, app/generated or migrations
              by hand. Change intent and rebuild instead.
          - id: supported_surface
            type: heading
            level: 2
            text: Current supported surface
          - id: surface_table
            type: table
            columns:
              - Area
              - Supported now
            rows:
              - - Targets
                - web_ts_minimal and next_shadcn
              - - Components
                - navbar
                - hero
                - card_grid
                - content
                - form
                - table
                - record_detail
                - stats
                - pricing_cards
                - footer
                - custom_component
              - - Actions
                - create_record
                - list_records
                - get_record
                - update_record
                - delete_record
                - subscribe_records
              - - Database
                - SQLite/libSQL and PostgreSQL drivers
      - id: docs_footer
        type: footer
        text: IntentStack documentation generated from semantic intent.
